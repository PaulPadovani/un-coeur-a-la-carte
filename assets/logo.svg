<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72"
     role="img" aria-label="Un cœur à la carte">
  <!-- Le cœur est coupé par les deux coutures du jeu de cartes : grosses
       artères / ventricules / oreillettes. De loin, trois traits ; de près,
       la grammaire du projet. Trait uniforme, aucun aplat d'encre. -->
  <defs>
    <clipPath id="dansLeCoeur">
      <path d="M36,63 C11,45 6,29 15,20 C22,13 30,15 36,23
               C42,15 50,13 57,20 C66,29 61,45 36,63 Z"/>
    </clipPath>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M36,63 C11,45 6,29 15,20 C22,13 30,15 36,23
             C42,15 50,13 57,20 C66,29 61,45 36,63 Z"/>
  </g>
  <g clip-path="url(#dansLeCoeur)" fill="none" stroke="currentColor"
     stroke-width="3" opacity="0.42" stroke-linecap="round">
    <path d="M4,31 L68,31"/>
    <path d="M4,45 L68,45"/>
  </g>
</svg>

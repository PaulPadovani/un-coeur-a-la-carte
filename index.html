<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un cœur à la carte — simulateur de physiologie cardiaque congénitale</title>
<link rel="alternate" hreflang="fr" href="./">
<link rel="alternate" hreflang="en" href="en/">
<link rel="stylesheet" href="css/vu.css?v=20261026-5">
</head>
<body>

<header>
  <div class="marque">
    <img class="logo" src="assets/serveur.png" alt="">
    <h1>Un cœur <em>à la carte</em></h1>
  </div>
  <p>Composez le cœur, lancez la circulation, stabilisez l’enfant.</p>
  <nav class="langue" aria-label="Langue">
    <span aria-current="page">FR</span>
    <a href="en/index.html?v=20261026-5" hreflang="en" lang="en" title="English version">EN</a>
  </nav>
  <button id="btn-flux" class="pilule on" aria-pressed="true"
          title="Afficher ou masquer les traceurs de débit">Flux</button>
  <div class="chrono"><span id="v-temps">H0</span></div>
</header>

<main>

  <!-- ---------------- zone gauche : construction ---------------- -->
  <section class="panneau" id="construction">
    <div class="titre-ligne">
      <h2>1 — Composer</h2>
      <button id="btn-normal" title="Repartir d’un cœur normal">Cœur normal</button>
    </div>
    <div id="slots"></div>
    <div class="transport">
      <button id="btn-start">Démarrer</button>
      <button id="btn-pause" disabled>Pause</button>
    </div>
    <label class="vitesse">Vitesse
      <input type="range" id="vitesse" min="10" max="360" value="60" step="10">
      <span id="v-vitesse">60 min/s</span>
    </label>

    <h2>2 — Stabiliser</h2>
    <div id="gestes"></div>
  </section>

  <!-- ---------------- zone centrale : le cœur ---------------- -->
  <section class="scene" aria-label="Anatomie et circulation">
    <button id="btn-mouvement" class="outil-scene" aria-pressed="false">Figer les flux</button>
    <div class="scene-corps">
      <svg id="coeur" viewBox="-50 -30 1220 2830" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Anatomie cardiaque assemblée, avec canal artériel et trajectoires colorées selon la vitesse relative des flux"></svg>
    </div>
  </section>

  <!-- ---------------- zone droite : moniteur ---------------- -->
  <section class="panneau moniteur">
    <h2>3 — Observer</h2>
    <div id="lecture-moniteur"></div>
    <details class="verdict" id="verdict"></details>
    <div class="etat-secondaire">
      <div class="canal-ligne">
        <span>Canal artériel</span>
        <strong id="v-canal">--</strong>
        <small id="v-canal-etat"></small>
      </div>
      <div class="reserve-ligne"><span>Réserve physiologique</span><strong id="v-reserve">100 %</strong></div>
      <div class="jauge"><div class="jauge-in ok" id="reserve"></div></div>
    </div>
    <div class="scope-compact">
      <div><span>FC</span><strong id="v-fc">140</strong><small>bpm</small></div>
      <canvas id="ecg" width="360" height="60" role="img" aria-label="Tracé ECG illustratif"></canvas>
    </div>
    <div id="reperes-emplacement"></div>
  </section>

</main>

<!-- ---------------- bandeau bas : transition circulatoire néonatale ---------------- -->
<footer class="transition">
  <div class="transition-tete">
    <button id="btn-graphe" title="Replier pour agrandir le schéma">Replier</button>
    <h2>Transition circulatoire</h2>
    <div class="legende">
      <span class="lg lg-rvp">RVP / RVS</span>
      <span class="lg lg-qp">Qp</span>
      <span class="lg lg-qs">Qs</span>
      <span class="lg lg-canal">canal artériel</span>
      <span class="lg lg-proj">projection</span>
    </div>
    <div class="lecture" id="lecture-transition">—</div>
  </div>
  <canvas id="transition" width="1600" height="180"></canvas>
</footer>

<script src="js/i18n.js?v=20261026-5"></script>
<script src="js/cartes.js?v=20261026-5"></script>
<script src="js/anatomie.js?v=20261026-5"></script>
<script src="js/model.js?v=20261026-5"></script>
<script src="js/champ.js?v=20261026-5"></script>
<script src="js/vitals.js?v=20261026-5"></script>
<script src="js/render.js?v=20261026-5"></script>
<script src="js/transition.js?v=20261026-5"></script>
<script src="js/lecture.js?v=20261026-5"></script>
<script src="js/main.js?v=20261026-5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un cœur à la carte — congenital heart physiology simulator</title>
<link rel="alternate" hreflang="fr" href="../">
<link rel="alternate" hreflang="en" href="./">
<link rel="stylesheet" href="../css/vu.css?v=20261026-6">
</head>
<body>

<header>
  <div class="marque">
    <img class="logo" src="../assets/serveur.png" alt="">
    <h1>Un cœur <em>à la carte</em></h1>
  </div>
  <p>Build the heart, start the circulation, stabilise the child.</p>
  <nav class="langue" aria-label="Language">
    <a href="../index.html?v=20261026-6" hreflang="fr" lang="fr" title="Version française">FR</a>
    <span aria-current="page">EN</span>
  </nav>
  <button id="btn-flux" class="pilule on" aria-pressed="true"
          title="Show or hide flow tracers">Flow</button>
  <div class="chrono"><span id="v-temps">H0</span></div>
</header>

<main>

  <!-- Left panel: anatomy and interventions -->
  <section class="panneau" id="construction">
    <div class="titre-ligne">
      <h2>1 — Assemble</h2>
      <button id="btn-normal" title="Reset to a normal heart">Normal heart</button>
    </div>
    <div id="slots"></div>
    <div class="transport">
      <button id="btn-start">Start</button>
      <button id="btn-pause" disabled>Pause</button>
    </div>
    <label class="vitesse">Speed
      <input type="range" id="vitesse" min="10" max="360" value="60" step="10">
      <span id="v-vitesse">60 min/s</span>
    </label>

    <h2>2 — Stabilise</h2>
    <div id="gestes"></div>
  </section>

  <!-- Centre panel: assembled heart -->
  <section class="scene" aria-label="Anatomy and circulation">
    <button id="btn-mouvement" class="outil-scene" aria-pressed="false">Freeze flow</button>
    <div class="scene-corps">
      <svg id="coeur" viewBox="-50 -30 1220 2830" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="Assembled cardiac anatomy, with ductus arteriosus and paths colored by relative flow speed"></svg>
    </div>
  </section>

  <!-- Right panel: physiological monitor -->
  <section class="panneau moniteur">
    <h2>3 — Observe</h2>
    <div id="lecture-moniteur"></div>
    <details class="verdict" id="verdict"></details>
    <div class="etat-secondaire">
      <div class="canal-ligne">
        <span>Ductus arteriosus</span>
        <strong id="v-canal">--</strong>
        <small id="v-canal-etat"></small>
      </div>
      <div class="reserve-ligne"><span>Physiological reserve</span><strong id="v-reserve">100 %</strong></div>
      <div class="jauge"><div class="jauge-in ok" id="reserve"></div></div>
    </div>
    <div class="scope-compact">
      <div><span>HR</span><strong id="v-fc">140</strong><small>bpm</small></div>
      <canvas id="ecg" width="360" height="60" role="img" aria-label="Illustrative ECG trace"></canvas>
    </div>
    <div id="reperes-emplacement"></div>
  </section>

</main>

<!-- Neonatal circulatory transition -->
<footer class="transition">
  <div class="transition-tete">
    <button id="btn-graphe" title="Collapse to enlarge the diagram">Collapse</button>
    <h2>Circulatory transition</h2>
    <div class="legende">
      <span class="lg lg-rvp">PVR / SVR</span>
      <span class="lg lg-qp">Qp</span>
      <span class="lg lg-qs">Qs</span>
      <span class="lg lg-canal">ductus arteriosus</span>
      <span class="lg lg-proj">projection</span>
    </div>
    <div class="lecture" id="lecture-transition">—</div>
  </div>
  <canvas id="transition" width="1600" height="180"
          aria-label="Neonatal circulatory transition graph"></canvas>
</footer>

<script>window.APP_LANG = 'en';</script>
<script src="../js/i18n.js?v=20261026-6"></script>
<script src="../js/cartes.js?v=20261026-6"></script>
<script src="../js/anatomie.js?v=20261026-6"></script>
<script src="../js/model.js?v=20261026-6"></script>
<script src="../js/champ.js?v=20261026-6"></script>
<script src="../js/vitals.js?v=20261026-6"></script>
<script src="../js/render.js?v=20261026-6"></script>
<script src="../js/continu.js?v=20261027-1"></script>
<script src="../js/transition.js?v=20261026-6"></script>
<script src="../js/lecture.js?v=20261026-6"></script>
<script src="../js/main.js?v=20261026-6"></script>
</body>
</html>
